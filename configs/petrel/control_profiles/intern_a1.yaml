schema: openpi_petrel_control_profile_registry_v1
# profile_defaults:
#   stats_group_template: profile/{dataset_id}/{robot_id}
control_profiles:
  a1_single_ee:
    control_type: single_arm
    mapping:
      single_arm_slot: right
      pose_input: xyz_quat_wxyz  # origin dataset ee pose format
      action_pose_semantics: absolute_target #  origin dataset ee pose semantics
      missing_policy: pad_and_mask
      frame_transform:
        world_from_source: robot_to_opencv
        source_ee_from_canonical_ee: ee_source_z_to_canonical_z
      slots:
        right:
          joint:
            state_key: states.joint.position
            action_key: actions.joint.position
            raw_slice:
            - 0
            - 7
            target_slot: right.joint
          # ee:
          #   state_key: states.tcp_to_robot_pose
          #   action_key: actions.tcp_to_robot_pose
          #   raw_slice:
          #   - 0
          #   - 7
          #   target_slot: right.ee
          gripper:
            state_key: states.gripper.position
            action_key: actions.gripper.openness
            raw_slice:
            - 0
            - 1
            target_slot: right.gripper
    fields:
      state:
        keys:
        - states.joint.position
        # - states.tcp_to_robot_pose
        - states.gripper.position
      action:
        keys:
        - actions.joint.position
        # - actions.tcp_to_robot_pose
        - actions.gripper.openness
      video:
        key: auto
        key_map:
          images.rgb.head: base_0_rgb
          images.rgb.hand: right_wrist_0_rgb
      language:
        source: meta/tasks.parquet
      timestamp:
        key: timestamp
      frame_index:
        key: frame_index
      task_index:
        key: task_index
