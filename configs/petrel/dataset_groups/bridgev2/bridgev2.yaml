schema: openpi_petrel_dataset_group_v1
name: bridgev2
category: bridgev2
profile: bridge_single_delta_ee
control_profiles:
  bridge_single_delta_ee:
    control_type: single_arm
    mapping:
      layout: robot
      single_arm_slot: right
      pose_input: xyz_rpy
      action_pose_input: delta_xyz_rpy
      state_pose_output: xyz_rot6d
      action_pose_output: xyz_rotvec
      missing_policy: pad_and_mask
      frame_transform:
        world_from_source: z_up_to_opencv
        source_ee_from_canonical_ee: opencv_to_robot
      slots:
        right:
          ee:
            state_position_key: state.ee_pos
            state_rotation_key: state.ee_rot
            action_position_key: action.delta_ee_pos
            action_rotation_key: action.delta_ee_rot
            state_target_slice:
            - 47
            - 56
            action_target_slice:
            - 47
            - 53
          gripper:
            state_key: state.gripper
            action_key: action.gripper
            raw_slice:
            - 0
            - 1
            target_slice:
            - 56
            - 57
            action_from_next_state: true
    fields:
      state:
        keys:
        - state.ee_pos
        - state.ee_rot
        - state.gripper
      action:
        keys:
        - action.delta_ee_pos
        - action.delta_ee_rot
        - action.gripper
      video:
        keys:
        - video.image_0
        - video.image_1
        - video.image_2
      language:
        source: meta/tasks.jsonl
      timestamp:
        key: timestamp
      frame_index:
        key: frame_index
      task_index:
        key: task_index
format: v2
root: manip:manip-dataset/public/real
fields:
  video:
    keys:
    - video.image_0
  video_concat: single
datasets:
- name: InternData-BridgeV2
  path: InternData-BridgeV2
