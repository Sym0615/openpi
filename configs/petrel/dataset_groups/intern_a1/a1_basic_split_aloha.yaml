            - 6
            target_slice:
            - 0
            - 6
          ee:
            state_key: states.left_tcp_to_robot_pose
            action_key: actions.left_tcp_to_robot_pose
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 7
            - 16
            action_target_slice:
            - 7
            - 13
          gripper:
            state_key: states.left_gripper.position
            action_key: actions.left_gripper.position
            raw_slice:
            - 0
            - 1
            target_slice:
            - 16
            - 17
        right:
          joint:
            state_key: states.right_joint.position
            action_key: actions.right_joint.position
            raw_slice:
            - 0
            - 6
            target_slice:
            - 40
            - 46
          ee:
            state_key: states.right_tcp_to_robot_pose
            action_key: actions.right_tcp_to_robot_pose
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 47
            - 56
            action_target_slice:
            - 47
            - 53
          gripper:
            state_key: states.right_gripper.position
            action_key: actions.right_gripper.position
            raw_slice:
            - 0
            - 1
            target_slice:
            - 56
            - 57
    fields:
      state:
        keys:
        - states.left_joint.position
        - states.left_tcp_to_robot_pose
        - states.left_gripper.position
        - states.right_joint.position
        - states.right_tcp_to_robot_pose
        - states.right_gripper.position
      action:
        keys:
        - actions.left_joint.position
        - actions.left_tcp_to_robot_pose
        - actions.left_gripper.position
        - actions.right_joint.position
        - actions.right_tcp_to_robot_pose
        - actions.right_gripper.position
      video:
        key: auto
      language:
        source: meta/tasks.parquet
      timestamp:
        key: timestamp
      frame_index:
        key: frame_index
      task_index:
        key: task_index
format: v3
root: manip:manip-dataset/private/sim/InternData-A1_v30/basic_tasks/split_aloha
fields:
