# InternData-A1-only OpenPI configuration. Common control mappings and the
# OpenPI tensor contract are inherited from the repository-local Petrel config.
extends: pi05_petrel.yaml
dataset_id: intern_a1
openpi:
  control_projection: pi05_aloha_32
storage:
  # Read the mounted local mirror by default. Override the backend from the training CLI when needed.
  backend: local
  local_root: /manip/private/sim/InternData-A1_v30
  local_remote_prefix: manip:manip-dataset/private/sim/InternData-A1_v30
mixture:
  category_weights:
    intern_a1: 1.0
dataset_files:
  directory: dataset_groups/intern_a1
  recursive: false
  pattern: '*.yaml'