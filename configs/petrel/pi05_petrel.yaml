      state_pose_output: xyz_rot6d
      action_pose_output: xyz_rotvec
      missing_policy: pad_and_mask
      frame_transform:
        world_from_source: robot_to_opencv
        source_ee_from_canonical_ee: ee_source_z_to_canonical_z
      slots:
        left:
          joint:
            state_key: states.left_joint.position
            action_key: actions.left_joint.position
            raw_slice:
            - 0
            - 7
            target_slice:
            - 0
            - 7
          ee:
            state_key: states.left_tcp_to_robot_pose
            action_key: actions.left_tcp_to_robot_pose
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 7
            - 16
            action_target_slice:
            - 7
            - 13
          gripper:
            state_key: states.left_gripper.position
            action_key: actions.left_gripper.position
            raw_slice:
            - 0
            - 1
            target_slice:
            - 16
            - 17
        right:
          joint:
            state_key: states.right_joint.position
            action_key: actions.right_joint.position
            raw_slice:
            - 0
            - 7
            target_slice:
            - 40
            - 47
          ee:
            state_key: states.right_tcp_to_robot_pose
            action_key: actions.right_tcp_to_robot_pose
            raw_slice:
            - 0
            - 7
            state_target_slice:
            - 47
            - 56
            action_target_slice:
            - 47
            - 53
          gripper:
