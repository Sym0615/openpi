schema: openpi_petrel_v1
dataset_id: petrel_mixed
openpi:
  state_dim: 32
  action_dim: 32
  action_horizon: 16
  images:
    size:
    - 224
    - 224
    dtype: uint8
    channels: rgb
    slots:
    - base_0_rgb
    - left_wrist_0_rgb
    - right_wrist_0_rgb
  normalization: quantile
  control_projection: compact_valid
storage:
  petrel_conf: ~/petreloss.conf
  parquet_cache_size: 8
  metadata_cache: data/petrel_cache/meta/{remote}
  path_index_cache: data/petrel_cache/path_index/{remote}
sampling:
  state_frames: 1
  action_horizon: 16
  stride: 1
  allow_end_padding: false
  training_block_size: 16
  training_frame_stride: 1
mixture:
  seed: 42
  balance_by_dataset: false
  balance_by_trajectory: true
  distribute_category_weight_by_valid_windows: true
  category_weights:
    intern_a1: 2.05
    intern_m1: 0.95
    bridgev2: 1.27
    agibotworld: 3.18
    galaxea_no_mobile_torso: 0.66
    oxe: 1.89
source_control_space:
  name: robot
  dim: 80
  slots:
    left:
      joint:
      - 0
      - 7
      ee:
      - 7
      - 16
      gripper:
      - 16
      - 17
      hand:
      - 17
      - 40
    right:
      joint:
      - 40
      - 47
      ee:
      - 47
      - 56
      gripper:
      - 56
      - 57
      hand:
      - 57
      - 80
  missing_policy: pad_and_mask
  pose:
    state: xyz_rot6d
    action: delta_xyz_rotvec
  camera_frame_delta: false
dataset_files:
  directory: dataset_groups
  recursive: true
  pattern: '*.yaml'
