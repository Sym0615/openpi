          skip_dims: []
          state_signal: state_right_joint_position
          threshold: 0.65
          action_timing: leads_state
          delta_compare_mode: integrate
          gripper_threshold: 0.65
        eps_frac: 0.15
        lag_corr_tolerance: 0.0
        max_bad_dims: 1
        max_lag: 10
